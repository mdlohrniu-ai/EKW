<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Seating chart</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  html, body { height: 100%; margin: 0; }
  body { font-family: system-ui, -apple-system, sans-serif; color: #1a1a1a; display: flex; flex-direction: column; }
  *, *::before, *::after { box-sizing: border-box; }
  .pip { width:12px; height:12px; border-radius:50%; border:1.5px solid rgba(255,255,255,0.55); }
  .pip-active { cursor:pointer; }
  .pip-locked { cursor:default; opacity:0.5; }
  button { font-size: 14px; padding: 8px 14px; cursor: pointer; margin-right: 8px; margin-bottom: 8px; }
  .namebtn { background:none; border:1px solid #ccc; border-radius:6px; padding:4px 10px; font-size:12px; cursor:pointer; margin:3px; }
  .desk-wrap { position: relative; }
  .desk-toggle { position:absolute; top:-8px; right:-8px; opacity:0; transition:opacity .15s; cursor:pointer; background:#fff; border:1px solid #999; border-radius:50%; width:20px; height:20px; display:flex; align-items:center; justify-content:center; font-size:12px; z-index:1; }
  .desk-wrap:hover .desk-toggle { opacity:1; }
  #stat { font-size: 13px; color: #555; margin: 8px 0; }
  #lateList { margin-bottom: 12px; }
  #header { flex-shrink: 0; padding: 16px 20px 0; }
  #gridWrapper { flex: 1; min-height: 0; overflow: hidden; display: flex; justify-content: center; align-items: flex-start; }
  #grid { display:grid; grid-template-columns:repeat(4,172px); gap:14px 10px; align-items:start; }
</style>
</head>
<body>
<div id="loginGate" style="max-width:340px;margin:80px auto;text-align:center;">
  <h2 style="font-size:18px;">Seating chart login</h2>
  <input type="password" id="pwInput" placeholder="Enter password" style="font-size:16px;padding:10px;width:100%;box-sizing:border-box;">
  <button id="pwSubmit" style="width:100%;margin-top:8px;">Enter</button>
  <div id="pwError" style="color:#c0392b;margin-top:8px;"></div>
</div>
<div id="appContent" style="display:none;flex-direction:column;height:100%;">
<div id="header">
<h2 style="font-size:18px;margin:0 0 10px;">Seating chart</h2>
<div>
  <button id="randomizeBtn">Randomize seating</button>
  <button id="compactBtn">Compact</button>
  <button id="callBtn">Call random student</button>
  <button id="manualMoveBtn">Manual move</button>
  <button id="refreshBtn">Refresh</button>
  <button id="resetBtn" style="background:#fdecea;">Reset for next class</button>
  <button id="exportBtn">Export attendance</button>
</div>
<div id="stat"></div>
<div id="lateList"></div>
<div style="font-size:12px;color:#777;margin-bottom:6px;white-space:nowrap;">Click a name to mark absent. Left-click the next open pip for volunteered, right-click for randomly called. Hover a desk to block it.</div>
</div>
<div id="gridWrapper"><div id="scene">
  <div id="teacherRow" style="display:flex;justify-content:center;margin-bottom:14px;">
    <div style="background:#8a8a8a;color:#fff;font-weight:600;font-size:11px;width:78px;height:70px;border-radius:8px;display:flex;align-items:center;justify-content:center;text-align:center;">Teacher</div>
  </div>
  <div id="grid"></div>
</div></div>
<div id="statusMenu" style="display:none;position:fixed;background:#fff;border:1px solid #999;border-radius:6px;box-shadow:0 2px 8px rgba(0,0,0,0.25);z-index:10;padding:4px 0;"></div>
</div>

<script>
const WEBAPP_URL = 'https://script.google.com/macros/s/AKfycbyrLC65WFSm4-sYjiosqIemHh1XUpdcOL6XP6flOMsBqrShomfQZ_mUDkiLEheB6qGE/exec';
const COLUMNS = 4;
const POLL_MS = 15000;

let roster = [];
let state = { seats: [], absent: [], blocked: [], pips: {}, lastPicked: null, activePairCount: 0, attendanceStatus: {} };
let lastMoved = 0;
let savedPassword = localStorage.getItem('seatingPassword') || '';

const STATUSES = ['Attended', 'Attendance Granted', 'Left Early', 'Arrived Late', 'No Information'];
const STATUS_BADGE = { 'Attendance Granted': 'Granted', 'Left Early': 'Left early', 'Arrived Late': 'Late' };

function statusFor(id) {
  if (state.attendanceStatus && state.attendanceStatus[id]) return state.attendanceStatus[id];
  return state.absent.indexOf(id) !== -1 ? 'No Information' : 'Attended';
}

async function setStatus(id, status) { applyStateResponse(await callAction('setStatus', { studentId: id, status: status })); }

function showStatusMenu(x, y, id) {
  const menu = document.getElementById('statusMenu');
  menu.innerHTML = '';
  const current = statusFor(id);
  STATUSES.forEach(function (s) {
    const item = document.createElement('div');
    const isCurrent = s === current;
    item.textContent = (isCurrent ? '✓ ' : '') + s;
    item.style.cssText = 'padding:6px 16px;cursor:pointer;font-size:13px;white-space:nowrap;' + (isCurrent ? 'font-weight:600;background:#eef5ff;' : '');
    item.onmouseover = function () { if (!isCurrent) item.style.background = '#f0f0f0'; };
    item.onmouseout = function () { item.style.background = isCurrent ? '#eef5ff' : ''; };
    item.onclick = function () { setStatus(id, s); menu.style.display = 'none'; };
    menu.appendChild(item);
  });
  menu.style.left = x + 'px';
  menu.style.top = y + 'px';
  menu.style.display = 'block';
}
document.addEventListener('click', function () { document.getElementById('statusMenu').style.display = 'none'; });

document.getElementById('exportBtn').onclick = async function () {
  const session = prompt('Session name for this export (e.g. "Class #31-1"):', '');
  if (session === null) return;
  const btn = this;
  btn.textContent = 'Exporting...';
  btn.disabled = true;
  try {
    const data = await callAction('exportAttendance', { session: session });
    if (data.error) { alert('Export failed: ' + data.error); return; }
    const link = document.createElement('a');
    link.href = 'data:application/vnd.openxmlformats-officedocument.spreadsheetml.sheet;base64,' + data.file;
    link.download = data.filename;
    link.click();
  } catch (err) {
    alert('Export failed: ' + err);
  } finally {
    btn.textContent = 'Export attendance';
    btn.disabled = false;
  }
};

async function callAction(action, params) {
  const qs = new URLSearchParams(Object.assign({ action: action, password: savedPassword }, params || {}));
  const res = await fetch(WEBAPP_URL + '?' + qs.toString());
  return res.json();
}

async function tryLogin(pw) {
  const res = await fetch(WEBAPP_URL + '?action=getState&password=' + encodeURIComponent(pw));
  const data = await res.json();
  return !data.error;
}

document.getElementById('pwSubmit').onclick = async function () {
  const pw = document.getElementById('pwInput').value;
  const ok = await tryLogin(pw);
  if (ok) {
    savedPassword = pw;
    localStorage.setItem('seatingPassword', pw);
    document.getElementById('loginGate').style.display = 'none';
    document.getElementById('appContent').style.display = 'flex';
    boot();
  } else {
    document.getElementById('pwError').textContent = 'Wrong password, try again.';
  }
};

function applyStateResponse(data) {
  if (data.state) { state = data.state; lastMoved = data.moved || 0; }
  else { state = data; }
  render();
}

async function loadRoster() {
  roster = await callAction('getRoster');
}

async function loadState() {
  const data = await callAction('getState');
  applyStateResponse(data);
}

function rosterName(id) {
  const r = roster.find(function (x) { return x.id === id; });
  return r ? r.name : id;
}

function pipsFor(id) {
  return state.pips[id] || ['', '', '', '', ''];
}

function pipCount(id) { return pipsFor(id).filter(function (p) { return p; }).length; }

function pipColor(v) {
  if (v === 'green') return '#4ade80';
  if (v === 'orange') return '#fb923c';
  return 'transparent';
}

async function toggleAbsent(id) { applyStateResponse(await callAction('toggleAbsent', { studentId: id })); }
async function markArrived(id) { applyStateResponse(await callAction('markArrived', { studentId: id })); }
async function toggleBlocked(p) { applyStateResponse(await callAction('toggleBlocked', { pairIndex: p })); }
async function addPip(id, color) { applyStateResponse(await callAction('addPip', { studentId: id, color: color })); }
async function removeLastPip(id) { applyStateResponse(await callAction('removeLastPip', { studentId: id })); }
async function randomCall() { applyStateResponse(await callAction('randomCall')); }
async function randomizeSeating() { applyStateResponse(await callAction('randomizeSeating')); }
async function compactSeating() { applyStateResponse(await callAction('compactSeating')); }
async function moveSeat(from, to) { applyStateResponse(await callAction('moveSeat', { from: from, to: to })); }

let manualMove = false;

function buildChip(id) {
  const el = document.createElement('div');
  const isAbsent = state.absent.indexOf(id) !== -1;
  const isPicked = state.lastPicked === id;
  const filled = pipCount(id);
  el.style.cssText = 'width:78px;height:70px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:2px;overflow:hidden;flex-shrink:0;';
  el.style.background = isAbsent ? '#eee' : '#0c447c';
  el.style.color = isAbsent ? '#888' : '#e6f1fb';
  el.style.border = isPicked ? '4px solid #16a34a' : '2px solid transparent';
  const nameDiv = document.createElement('div');
  nameDiv.style.cssText = 'cursor:pointer;';
  const badge = STATUS_BADGE[statusFor(id)];
  nameDiv.innerHTML = '<div style="font-size:9px;opacity:0.8;">' + id + '</div><div style="font-size:11px;font-weight:600;">' + rosterName(id) + (isAbsent ? ' out' : '') + '</div>' + (badge ? '<div style="font-size:9px;opacity:0.85;">' + badge + '</div>' : '');
  nameDiv.onclick = function () { toggleAbsent(id); };
  nameDiv.oncontextmenu = function (e) { e.preventDefault(); e.stopPropagation(); showStatusMenu(e.clientX, e.clientY, id); };
  el.appendChild(nameDiv);
  const pipRow = document.createElement('div');
  pipRow.style.cssText = 'display:flex;gap:2px;margin-top:3px;';
  pipsFor(id).forEach(function (v, k) {
    const pip = document.createElement('div');
    pip.style.background = pipColor(v);
    if (k === filled - 1) {
      pip.className = 'pip pip-active';
      pip.onclick = function (e) { e.stopPropagation(); removeLastPip(id); };
      pip.oncontextmenu = function (e) { e.preventDefault(); e.stopPropagation(); removeLastPip(id); };
    } else if (k === filled && filled < 5) {
      pip.className = 'pip pip-active';
      pip.onclick = function (e) { e.stopPropagation(); addPip(id, 'green'); };
      pip.oncontextmenu = function (e) { e.preventDefault(); e.stopPropagation(); addPip(id, 'orange'); };
    } else {
      pip.className = 'pip pip-locked';
    }
    pipRow.appendChild(pip);
  });
  el.appendChild(pipRow);
  return el;
}

function emptySlot() {
  const d = document.createElement('div');
  d.style.cssText = 'width:78px;height:70px;border:1px dashed #ccc;flex-shrink:0;';
  return d;
}

function blankSpacer() {
  const d = document.createElement('div');
  d.style.cssText = 'width:78px;height:70px;flex-shrink:0;';
  return d;
}

function buildRowFromIds(ids) {
  const row = document.createElement('div');
  row.style.cssText = 'display:flex;gap:4px;';
  row.appendChild(ids[0] !== undefined ? buildChip(ids[0]) : emptySlot());
  row.appendChild(ids[1] !== undefined ? buildChip(ids[1]) : emptySlot());
  return row;
}

function buildTrioBottomRow(ids) {
  const row = document.createElement('div');
  row.style.cssText = 'display:flex;gap:4px;';
  row.appendChild(buildChip(ids[0]));
  row.appendChild(blankSpacer());
  return row;
}

function toggleBtn(p, isBlocked) {
  const b = document.createElement('div');
  b.className = 'desk-toggle';
  if (isBlocked) { b.style.opacity = '1'; }
  b.textContent = isBlocked ? '+' : '×';
  b.title = isBlocked ? 'unblock this desk' : 'block this desk';
  b.onclick = function (e) { e.stopPropagation(); toggleBlocked(p); };
  return b;
}

function fitGrid() {
  const scene = document.getElementById('scene');
  const wrapper = document.getElementById('gridWrapper');
  scene.style.transform = 'scale(1)';
  scene.style.transformOrigin = 'top center';
  const naturalWidth = scene.scrollWidth;
  const naturalHeight = scene.scrollHeight;
  if (!naturalWidth || !naturalHeight) return;
  const scale = Math.min(wrapper.clientWidth / naturalWidth, wrapper.clientHeight / naturalHeight);
  scene.style.transform = 'scale(' + scale + ')';
}
window.addEventListener('resize', fitGrid);

function render() {
  if (manualMove) { renderManualGrid(); return; }
  const grid = document.getElementById('grid');
  grid.innerHTML = '';
  const totalPairs = state.seats.length / 2;
  const deskGroups = [];
  for (let p = 0; p < totalPairs; p++) {
    const a = state.seats[p * 2], b = state.seats[p * 2 + 1];
    const occs = [];
    if (a && a.occ !== null && state.absent.indexOf(a.occ) === -1) occs.push(a.occ);
    if (b && b.occ !== null && state.absent.indexOf(b.occ) === -1) occs.push(b.occ);
    deskGroups.push(occs);
  }
  let lonelyIdx = -1;
  for (let p = totalPairs - 1; p >= 0; p--) {
    if (state.blocked.indexOf(p) === -1 && deskGroups[p].length === 1) { lonelyIdx = p; break; }
  }
  let mergeWithIdx = -1;
  if (lonelyIdx >= 0) {
    const front = lonelyIdx - COLUMNS;
    if (front >= 0 && state.blocked.indexOf(front) === -1 && deskGroups[front].length === 2) { mergeWithIdx = front; }
    else {
      const prev = lonelyIdx - 1;
      if (prev >= 0 && state.blocked.indexOf(prev) === -1 && deskGroups[prev].length === 2) { mergeWithIdx = prev; }
    }
  }
  for (let p = 0; p < totalPairs; p++) {
    const row = Math.floor(p / COLUMNS), col = p % COLUMNS;
    const wrapper = document.createElement('div');
    wrapper.className = 'desk-wrap';
    wrapper.style.gridColumn = String(col + 1);
    if (p === lonelyIdx && mergeWithIdx >= 0) {
      wrapper.style.gridRow = String(row + 1);
      wrapper.style.cssText += ';border:2px dashed #999;border-radius:8px;padding:4px;opacity:0.6;';
      wrapper.appendChild(buildRowFromIds([]));
      wrapper.appendChild(toggleBtn(p, false));
      grid.appendChild(wrapper);
      continue;
    }
    if (state.blocked.indexOf(p) !== -1) {
      wrapper.style.gridRow = String(row + 1);
      wrapper.style.cssText += ';border:2px dashed #999;border-radius:8px;padding:4px;background:#fafafa;opacity:0.6;';
      wrapper.appendChild(buildRowFromIds([]));
      wrapper.appendChild(toggleBtn(p, true));
    } else if (p === mergeWithIdx) {
      wrapper.style.gridRow = (row + 1) + ' / span 2';
      wrapper.style.cssText += ';border:2px solid #2d5c0d;border-radius:8px;display:flex;flex-direction:column;gap:14px;padding:2px 0;';
      const topInner = document.createElement('div');
      topInner.style.padding = '4px';
      topInner.appendChild(buildRowFromIds(deskGroups[p]));
      const bottomInner = document.createElement('div');
      bottomInner.style.padding = '4px';
      bottomInner.appendChild(buildTrioBottomRow(deskGroups[lonelyIdx]));
      wrapper.appendChild(topInner);
      wrapper.appendChild(bottomInner);
      wrapper.appendChild(toggleBtn(p, false));
    } else {
      const isEmpty = deskGroups[p].length === 0;
      wrapper.style.gridRow = String(row + 1);
      if (isEmpty) {
        wrapper.style.cssText += ';border:2px dashed #999;border-radius:8px;padding:4px;opacity:0.6;';
      } else {
        wrapper.style.cssText += ';border:2px solid #2d5c0d;border-radius:8px;padding:4px;';
      }
      wrapper.appendChild(buildRowFromIds(deskGroups[p]));
      wrapper.appendChild(toggleBtn(p, false));
    }
    grid.appendChild(wrapper);
  }
  const displayPairs = Math.ceil(totalPairs / COLUMNS) * COLUMNS;
  for (let p = totalPairs; p < displayPairs; p++) {
    const row = Math.floor(p / COLUMNS), col = p % COLUMNS;
    const filler = document.createElement('div');
    filler.style.gridColumn = String(col + 1);
    filler.style.gridRow = String(row + 1);
    filler.style.cssText += ';border:2px dashed #999;border-radius:8px;padding:4px;opacity:0.6;';
    filler.appendChild(buildRowFromIds([]));
    grid.appendChild(filler);
  }
  fitGrid();
  const presentCount = roster.filter(function (r) { return state.absent.indexOf(r.id) === -1; }).length;
  document.getElementById('stat').textContent = roster.length + ' on roster, ' + state.absent.length + ' absent, ' + presentCount + ' present, ' + state.blocked.length + ' desks blocked, last compact moved ' + lastMoved;
  const unseatedAbsent = roster.filter(function (r) { return state.absent.indexOf(r.id) !== -1; });
  const lateList = document.getElementById('lateList');
  lateList.innerHTML = '';
  if (unseatedAbsent.length) {
    const label = document.createElement('span');
    label.style.cssText = 'font-size:12px;color:#888;';
    label.textContent = 'not seated: ';
    lateList.appendChild(label);
    unseatedAbsent.forEach(function (r) {
      const btn = document.createElement('button');
      btn.className = 'namebtn';
      btn.textContent = r.name;
      btn.onclick = function () { markArrived(r.id); };
      lateList.appendChild(btn);
    });
  }
}

function renderManualGrid() {
  const grid = document.getElementById('grid');
  grid.innerHTML = '';
  const totalPairs = state.seats.length / 2;
  for (let p = 0; p < totalPairs; p++) {
    const row = Math.floor(p / COLUMNS), col = p % COLUMNS;
    const isBlocked = state.blocked.indexOf(p) !== -1;
    const wrapper = document.createElement('div');
    wrapper.style.gridColumn = String(col + 1);
    wrapper.style.gridRow = String(row + 1);
    wrapper.style.cssText = isBlocked
      ? 'border:2px dashed #999;border-radius:8px;padding:4px;background:#fafafa;opacity:0.6;'
      : 'border:2px solid #2d5c0d;border-radius:8px;padding:4px;';
    const rowDiv = document.createElement('div');
    rowDiv.style.cssText = 'display:flex;gap:4px;';
    [p * 2, p * 2 + 1].forEach(function (seatIdx) {
      const seat = state.seats[seatIdx];
      const occ = seat ? seat.occ : null;
      const cell = occ !== null ? buildChip(occ) : emptySlot();
      if (!isBlocked) {
        cell.draggable = true;
        cell.style.cursor = 'grab';
        cell.ondragstart = function (e) { e.dataTransfer.setData('text/plain', String(seatIdx)); };
        cell.ondragover = function (e) { e.preventDefault(); };
        cell.ondrop = function (e) {
          e.preventDefault();
          const fromIdx = Number(e.dataTransfer.getData('text/plain'));
          if (fromIdx !== seatIdx) moveSeat(fromIdx, seatIdx);
        };
      }
      rowDiv.appendChild(cell);
    });
    wrapper.appendChild(rowDiv);
    grid.appendChild(wrapper);
  }
  fitGrid();
}

document.getElementById('manualMoveBtn').onclick = function () {
  manualMove = !manualMove;
  this.style.background = manualMove ? '#fef3c7' : '';
  this.textContent = manualMove ? 'Manual move: drag to swap (click to stop)' : 'Manual move';
  render();
};
document.getElementById('randomizeBtn').onclick = randomizeSeating;
document.getElementById('compactBtn').onclick = compactSeating;
document.getElementById('callBtn').onclick = randomCall;
document.getElementById('refreshBtn').onclick = loadState;
document.getElementById('resetBtn').onclick = async function () {
  if (confirm('Clear today\'s seating, absences, and engagement pips? This does not affect the roster or blocked desks.')) {
    applyStateResponse(await callAction('resetDay'));
  }
};

async function boot() {
  await loadRoster();
  await loadState();
  setInterval(loadState, POLL_MS);
}

(async function initLogin() {
  if (savedPassword && await tryLogin(savedPassword)) {
    document.getElementById('loginGate').style.display = 'none';
    document.getElementById('appContent').style.display = 'flex';
    boot();
  }
})();
</script>
</body>
</html>
